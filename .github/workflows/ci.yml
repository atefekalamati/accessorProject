name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # scan the full history, not only the last commit

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLo "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          ./gitleaks version

      - name: Scan git history
        run: ./gitleaks git --config .gitleaks.toml --redact --exit-code 1 --no-banner -v .

  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: project_ak_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d project_ak_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/project_ak_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      # Hashed lock (SEC-06): a tampered or unpinned package fails the install.
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Lock drift check
        run: |
          python scripts/lock.py
          git diff --exit-code -- requirements.lock requirements-dev.lock \
            || { echo "::error::Locks are out of date; run 'python scripts/lock.py' and commit."; exit 1; }

      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m ruff format --check .

      - name: Type check
        run: python -m mypy app tests

      # Parallel like local runs (-n auto in pyproject.toml), so xdist-only problems such
      # as random parametrize ids fail here too. On the 2-vCPU runner it is about as fast
      # as a serial run (INF-07).
      - name: Tests
        run: python -m pytest -q -rs --junitxml=pytest-report.xml

      # Integration tests skip silently without a database; in CI every test must run.
      - name: Fail on skipped tests
        run: |
          python - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("pytest-report.xml").getroot()
          skipped = [
              f"{case.get('classname')}::{case.get('name')}"
              for case in root.iter("testcase")
              if case.find("skipped") is not None
          ]
          if skipped:
              print(f"{len(skipped)} test(s) skipped in CI:")
              print("\n".join(skipped))
              sys.exit(1)
          print("No skipped tests.")
          EOF

  # Ephemeral staging (OPS-08, ADR-037): the built image on an empty database, migrated
  # and seeded, then a smoke test. Throwaway secrets, generated here and never committed.
  staging-smoke:
    if: >-
      github.event_name == 'pull_request'
      || github.ref == 'refs/heads/master'
      || startsWith(github.ref, 'refs/heads/feat/phase-')
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      APP_ENV_FILE: .env.staging
      # Own project name and an in-memory database (docker-compose.staging.yml): never shares
      # containers or volumes with a dev stack.
      COMPOSE: >-
        docker compose -p project-ak-staging -f docker-compose.yml -f docker-compose.staging.yml
        --env-file .env.staging
      SMOKE_MOBILE: "+989120000001"

    steps:
      - uses: actions/checkout@v7

      - name: Write the throwaway staging environment
        run: |
          umask 077
          cat > .env.staging <<ENV
          ENVIRONMENT=staging
          JWT_SECRET=$(openssl rand -hex 32)
          OTP_HASH_SECRET=$(openssl rand -hex 32)
          OTP_MOCK_ENABLED=true
          OTP_MOCK_CODE=123456
          CORS_ORIGINS=http://localhost:3000
          MEDIA_STORAGE=memory
          MEDIA_PUBLIC_BASE_URL=http://localhost:8000/media
          MEDIA_ALLOWED_HOSTS=localhost
          RESERVATION_SWEEP_SECONDS=0
          POSTGRES_DB=project_ak_staging
          POSTGRES_USER=project_ak
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          DB_HOST_PORT=5432
          API_HOST_PORT=8000
          LOG_LEVEL=INFO
          ENV

      - name: Build the image and start the stack on an empty database
        run: $COMPOSE up -d --build --wait

      - name: Migrate and seed
        run: |
          $COMPOSE exec -T api alembic upgrade head
          $COMPOSE exec -T api python -m app.db.seed

      - name: Smoke - health, readiness, OTP login, catalog read
        run: python3 scripts/smoke.py login --mobile "$SMOKE_MOBILE" --token-file "$RUNNER_TEMP/smoke-token"

      - name: Promote the smoke user to super_admin
        run: |
          $COMPOSE exec -T -e SMOKE_MOBILE postgres             sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v mobile="$SMOKE_MOBILE"' <<'SQL'
          INSERT INTO user_roles (user_id, role_id)
          SELECT u.id, r.id FROM users u JOIN roles r ON r.name = 'super_admin'
          WHERE u.phone = :'mobile';
          SQL

      - name: Smoke - admin write
        run: python3 scripts/smoke.py admin --token-file "$RUNNER_TEMP/smoke-token"

      - name: API logs on failure
        if: failure()
        run: $COMPOSE logs --no-color api

      - name: Tear down the throwaway stack
        if: always()
        run: $COMPOSE down -v --remove-orphans

  # CD (OPS-09, ADR-037): after a merge to master with every job green, push the image to
  # GHCR as <sha> and phase-N. The only job with packages:write.
  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [secret-scan, checks, staging-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Image name and tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-api"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "sha=$image:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          phase="$(python3 scripts/phase_tag.py "$(git log -1 --format=%B)")"
          if [ -n "$phase" ]; then
            echo "phase=$image:$phase" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No phase number in the merge commit message; pushing <sha> only."
          fi

      - name: Build
        run: |
          docker build \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "${{ steps.tags.outputs.sha }}" .

      - name: Push to GHCR
        env:
          PHASE_TAG: ${{ steps.tags.outputs.phase }}
          SHA_TAG: ${{ steps.tags.outputs.sha }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$SHA_TAG"
          if [ -n "$PHASE_TAG" ]; then
            docker tag "$SHA_TAG" "$PHASE_TAG"
            docker push "$PHASE_TAG"
          fi
          docker logout ghcr.io
