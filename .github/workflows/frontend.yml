name: Frontend

# Runs only when the frontend, its frozen API contract or this workflow changes. The
# backend workflow (ci.yml) is separate and untouched.
on:
  push:
    branches: ["**"]
    paths:
      - "FRONTEND/**"
      - "BACKEND/docs/api/versions/openapi-phase-5.json"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [master]
    paths:
      - "FRONTEND/**"
      - "BACKEND/docs/api/versions/openapi-phase-5.json"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every `run` step works inside FRONTEND/; paths given to actions (`with:`) stay relative
# to the repo root.
defaults:
  run:
    working-directory: FRONTEND

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: FRONTEND/.nvmrc
          cache: npm
          cache-dependency-path: FRONTEND/package-lock.json

      - name: Install (lockfile only)
        run: npm ci --no-audit --no-fund

      - name: API types match openapi-phase-5.json
        run: npm run check:api

      - name: Lint and format
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: e2e (mock API, axe)
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: FRONTEND/playwright-report/
          retention-days: 7
